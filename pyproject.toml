[project]
name = "python-agent"
version = "0.1.0"
description = "Python、FastAPI 与 AI Agent 学习项目"
requires-python = ">=3.13,<3.15"
dependencies = [
    "deepagents==0.7.41",
    "fastapi>=0.115,<1",
    "grandalf==0.8",
    "langchain==1.5.2",
    "langchain-classic>=1,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-deepseek>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-openai==1.8.5",
    "langgraph==1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.2.4,<2",
    "sqlalchemy>=2,<3",
    "tavily-python>=0.8.5,<1",
    "unstructured[md]>=0.27.38",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.uv]
package = false
